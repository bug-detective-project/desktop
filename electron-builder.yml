appId: dev.bugdetective.desktop
productName: Bug Detective
copyright: Bug Detective
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  # The window icon (Linux); Windows takes resources/icon.png as the executable and installer icon.
  - resources/icon.png
  - '!**/*.map'
  # Shipped once as resources/THIRD_PARTY_NOTICES.md (extraResources below), not inside the archive.
  - '!out/THIRD_PARTY_NOTICES.md'
  # React Developer Tools download (src/main/devtools.ts): development only, never loaded when packaged.
  - '!out/main/chunks/downloadChromeExtension-*.js'
# Docker build contexts (workspace and QA images, with the QA CLI) and their tags.
extraResources:
  - from: build/docker
    to: docker
  # The projects catalog as it was at build time, used only before the first download succeeds.
  - from: build/catalog.fallback.json
    to: catalog.fallback.json
  # Run by the uninstaller (resources/installer.nsh) to remove the app's Docker data.
  - from: resources/remove-docker-data.ps1
    to: remove-docker-data.ps1
  # Licenses of third-party material bundled into the app (the flag SVGs, the bundled npm packages),
  # written by tools/write-notices.ts after the build and installed next to the app.
  - from: out/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
npmRebuild: false
# The Electron security fuses; the test build keeps them as they are.
afterPack: tools/after-pack.mjs
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Bug-Detective-Setup-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  artifactName: Bug-Detective-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bug Detective
  # Uninstalling removes the game state too: the Docker data (the player's code) goes with it
  # (installer.nsh), and a state without its code cannot go on. Updates keep both.
  deleteAppDataOnUninstall: true
  include: resources/installer.nsh
