name: ci

# Every push and pull request runs the fast layer (typecheck, lint, unit tests, stories).
# Pull requests into main also run the heavy layer: the integration tests on real Docker and the
# e2e tests on Electron under Xvfb. Every action is pinned by commit hash (tools/check-action-pins.mjs).
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SupportDesk publication for the unit tests that still read ../supportdesk-qa
        run: |
          ref=$(node --input-type=module -e "const m = await import('./test/e2e/supportdesk-version.ts'); console.log(m.SUPPORTDESK_QA_REF)")
          git clone --quiet --branch "$ref" https://github.com/bug-detective-project/supportdesk.git ../supportdesk-qa
      - name: Chromium for the stories (vitest browser mode)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:action-pins
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Unit tests and stories, with the coverage floor of vitest.config.ts
        run: pnpm run test:coverage

  heavy:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SupportDesk publication for the unit tests that still read ../supportdesk-qa
        run: |
          ref=$(node --input-type=module -e "const m = await import('./test/e2e/supportdesk-version.ts'); console.log(m.SUPPORTDESK_QA_REF)")
          git clone --quiet --branch "$ref" https://github.com/bug-detective-project/supportdesk.git ../supportdesk-qa
      - name: Chromium for the stories (vitest browser mode)
        run: pnpm exec playwright install --with-deps chromium
      - name: Electron binary and the libraries it needs under Xvfb
        run: |
          pnpm run electron:install
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libxss1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - name: Unit tests, stories and integration tests (real Docker), with the full coverage floor
        run: pnpm run test:coverage:full -- --coverage.thresholds.lines=78 --coverage.thresholds.branches=71 --coverage.thresholds.functions=69
      - name: End-to-end tests (Electron with the fake runtime, under Xvfb)
        # The hosted runner has no setuid chrome-sandbox: Playwright passes --no-sandbox itself, and
        # this variable covers the one test that spawns Electron directly (startup.spec.ts).
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: pnpm run test:e2e:headless:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: heavy-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
